<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Chama</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 px-4 py-6">
    <div class="mx-auto w-full max-w-xl">
        <div class="rounded-2xl bg-white p-5 shadow-sm sm:p-7">

            <!-- your existing heading and form stay here -->

            <form action="/chama/create" method="POST">
                <!-- keep all your existing fields -->

                <button
                    type="submit"
                    class="mt-5 w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700"
                >
                    Create Chama
                </button>
            </form>

        </div>
    </div>
</body>
</html>
