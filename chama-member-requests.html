<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Requests</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-3xl px-4 py-8"><div class="mb-6"><a href="/chama/roster?chama_id={{.ChamaID}}" class="text-sm text-[#2f7a52]">← Back to Chama</a><h1 class="mt-2 text-2xl font-bold text-[#1f5c3d]">Member Requests</h1><p class="text-sm text-[#26241f]/60">{{.ChamaName}}</p></div>{{if .Requests}}<div class="space-y-4">{{range .Requests}}<article class="rounded-2xl bg-[#f4efe2] p-5"><div class="flex flex-wrap justify-between gap-2"><div><h2 class="font-semibold text-[#1f5c3d]">{{.ApplicantName}}</h2><p class="text-sm">{{.Phone}}</p></div><span class="rounded-full bg-[#c96f4a]/10 px-2 py-1 text-xs font-semibold text-[#c96f4a]">Pending Approval</span></div>{{if .Note}}<p class="mt-3 text-sm text-[#26241f]/75">Note: {{.Note}}</p>{{end}}<p class="mt-2 text-xs text-[#26241f]/50">Submitted {{.CreatedAt}}</p><div class="mt-4 flex gap-2"><form action="/chama/member-requests/review" method="POST" class="flex-1"><input type="hidden" name="request_id" value="{{.ID}}"><input type="hidden" name="chama_id" value="{{.ChamaID}}"><input type="hidden" name="action" value="approve"><button class="w-full rounded-lg bg-[#1f5c3d] px-3 py-2.5 text-sm font-semibold text-[#fbf8f1]">Approve Member</button></form><form action="/chama/member-requests/review" method="POST"><input type="hidden" name="request_id" value="{{.ID}}"><input type="hidden" name="chama_id" value="{{.ChamaID}}"><input type="hidden" name="action" value="decline"><button class="rounded-lg border border-[#c96f4a] px-3 py-2.5 text-sm font-semibold text-[#c96f4a]">Decline</button></form></div></article>{{end}}</div>{{else}}<div class="rounded-2xl bg-[#f4efe2] p-8 text-center text-sm text-[#26241f]/60">No pending member requests.</div>{{end}}</main></body></html>
