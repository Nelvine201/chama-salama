<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Pending Requests</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-2xl px-4 py-8"><div class="mb-6 flex items-center justify-between"><div><h1 class="text-2xl font-bold text-[#1f5c3d]">My Join Requests</h1><p class="text-sm text-[#26241f]/60">Track requests you have submitted.</p></div><a href="/chama/discover" class="rounded-lg bg-[#1f5c3d] px-4 py-2 text-sm font-semibold text-[#fbf8f1]">Discover Chamas</a></div>{{if .Requests}}<div class="space-y-3">{{range .Requests}}<div class="rounded-2xl bg-[#f4efe2] p-5"><div class="flex justify-between gap-3"><strong class="text-[#1f5c3d]">{{.ChamaName}}</strong><span class="rounded-full bg-[#c96f4a]/10 px-2 py-1 text-xs font-semibold capitalize text-[#c96f4a]">{{.Status}}</span></div><p class="mt-2 text-sm">Submitted {{.CreatedAt}}</p>{{if .Note}}<p class="mt-2 text-sm text-[#26241f]/70">“{{.Note}}”</p>{{end}}</div>{{end}}</div>{{else}}<div class="rounded-2xl bg-[#f4efe2] p-8 text-center text-sm text-[#26241f]/60">You have no join requests yet.</div>{{end}}</main></body></html>
