<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chama Salama — Members</title>
  <style>
    body { font-family: sans-serif; margin: 0; color: #26241f; background-color: #fbf8f1; }
    header { display: flex; align-items: center; padding: 20px 40px; border-bottom: 1px solid #ddd; }
    header svg { margin-right: 10px; }
    header h1 { font-size: 20px; color: #1f5c3d; margin: 0; }
    main { max-width: 460px; margin: 60px auto; padding: 0 20px; }
    .card { background: #f4efe2; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
    .card h2 { color: #1f5c3d; margin-top: 0; }
    .member-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e0dccf; font-size: 14px; }
    .member-row:last-of-type { border-bottom: none; }
    .role-badge { color: #2f7a52; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 14px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #1f5c3d; color: #fbf8f1; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .message { margin-top: 14px; font-size: 14px; color: #c96f4a; }
    a { color: #2f7a52; }
  </style>
</head>
<body>
  <header>
    <svg width="28" height="28" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#e6c258" stroke-width="4"/>
      <circle cx="50" cy="50" r="40" fill="#f4efe2"/>
      <path d="M14 50 Q50 96 86 50 L80 70 Q50 86 20 70 Z" fill="#2f7a52"/>
      <circle cx="50" cy="42" r="4" fill="#e6c258"/>
    </svg>
    <h1>Chama Salama</h1>
  </header>
  <main>
    <div class="card">
      <h2>{{.ChamaName}} — Members</h2>
      {{range .Roster}}
      <div class="member-row">
        <span>{{.Name}}</span>
        <span class="role-badge">{{.Role}}</span>
      </div>
      {{end}}
    </div>

    {{if .IsAdmin}}
    <div class="card">
      <h2>Invite a member</h2>
      <form action="/chama/invite" method="POST">
        <input type="hidden" name="chama_id" value="{{.ChamaID}}">
        <label>Phone or email</label>
        <input type="text" name="identifier" required>
        <label>Role</label>
        <select name="role">
          <option value="member">Member</option>
          <option value="treasurer">Treasurer</option>
          <option value="secretary">Secretary</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit">Send invitation</button>
      </form>
      {{if .Message}}<p class="message">{{.Message}}</p>{{end}}
    </div>
    {{end}}

    <p style="margin-top: 16px; font-size: 13px;"><a href="/chama/my-chamas">Back to My Chamas</a></p>
  </main>
</body>
</html>
