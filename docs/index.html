<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chama Salama</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      color: #26241f;
      background-color: #fbf8f1;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #ddd;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #1f5c3d;
      font-weight: bold;
    }
    main {
      padding: 60px 40px;
      max-width: 600px;
    }

    main h2 {
      color: #1f5c3d;
    }
    footer {
      padding: 20px 40px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    footer a {
      color: #1f5c3d;
    }

    nav a:hover,
    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      main {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="45" height="45" viewBox="0 0 100 100" style="vertical-align: middle; margin-right: 8px;">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#e6c258" stroke-width="4"/>
        <circle cx="50" cy="50" r="40" fill="#f4efe2"/>
        <path d="M14 50 Q50 96 86 50 L80 70 Q50 86 20 70 Z" fill="#2f7a52"/>
        <circle cx="50" cy="42" r="4" fill="#e6c258"/>
      </svg>
      Chama Salama
    </h1>
    <nav>
      <a href="#">Sign in</a>
      <a href="#">Sign up</a>
    </nav>
  </header>
  <main>
    <h2>Track your chama's contributions, payouts, and withdrawals — even offline.</h2>
    <p>Built for Kenyan savings groups. Works without internet, syncs when you're back online.</p>
  </main>
  <footer>
    <p>&copy; 2026 Chama Salama</p>
    <a href="terms.html">Terms and conditions</a>
  </footer>
</html>
