<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group History — Chama Salama</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-4xl px-4 py-7 sm:px-6"><div class="mb-7 flex items-center justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-widest text-[#2f7a52]">Audit log</p><h1 class="text-2xl font-bold text-[#1f5c3d]">{{.ChamaName}}</h1></div><a href="/dashboard?chama_id={{.ChamaID}}" class="rounded-lg bg-[#1f5c3d] px-4 py-2 text-sm font-bold text-[#fbf8f1]">Dashboard</a></div><div class="space-y-3">{{range .Rows}}<article class="rounded-2xl border border-[#e4ded1] bg-[#fffdf8] p-4"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="font-bold text-[#1f5c3d]">{{.Event}}</p><p class="mt-1 text-sm">{{.Details}}</p><p class="mt-1 text-xs text-[#716e66]">By {{.User}}</p></div><time class="text-xs text-[#716e66]">{{.CreatedAt}}</time></div></article>{{else}}<div class="rounded-2xl border border-[#e4ded1] bg-[#f4efe2] p-10 text-center text-sm text-[#716e66]">No group history is available yet.</div>{{end}}</div></main></body></html>
