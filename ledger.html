<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Ledger — Chama Salama</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-6xl px-4 py-7 sm:px-6"><div class="mb-7 flex flex-wrap items-end justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-widest text-[#2f7a52]">Master ledger</p><h1 class="text-2xl font-bold text-[#1f5c3d]">{{.ChamaName}}</h1></div><div class="flex gap-2"><a href="/ledger/pdf?chama_id={{.ChamaID}}" class="rounded-lg border border-[#1f5c3d] px-4 py-2 text-sm font-bold text-[#1f5c3d]">Download PDF Statement</a><a href="/dashboard?chama_id={{.ChamaID}}" class="rounded-lg bg-[#1f5c3d] px-4 py-2 text-sm font-bold text-[#fbf8f1]">Dashboard</a></div></div><form class="mb-4 flex gap-2" method="get"><input type="hidden" name="chama_id" value="{{.ChamaID}}"><input name="q" value="{{.Search}}" placeholder="Search member, date or status" class="min-w-0 flex-1 rounded-lg border border-[#e4ded1] bg-[#fffdf8] px-4 py-3 text-sm outline-none focus:border-[#1f5c3d]"><button class="rounded-lg bg-[#1f5c3d] px-5 py-3 text-sm font-bold text-[#fbf8f1]">Search</button></form><div class="overflow-hidden rounded-2xl border border-[#e4ded1] bg-[#fffdf8]"><div class="overflow-x-auto"><table class="w-full min-w-[850px] text-left text-sm"><thead class="bg-[#f4efe2] text-xs uppercase tracking-wide text-[#716e66]"><tr><th class="px-5 py-4">Date</th><th class="px-5 py-4">Member</th><th class="px-5 py-4">Type</th><th class="px-5 py-4">Amount</th><th class="px-5 py-4">M-Pesa Receipt</th><th class="px-5 py-4">Status</th></tr></thead><tbody class="divide-y divide-[#e4ded1]">{{range .Rows}}<tr><td class="px-5 py-4">{{.Date}}</td><td class="px-5 py-4 font-semibold">{{.Member}}</td><td class="px-5 py-4">{{.Type}}</td><td class="px-5 py-4 font-semibold">KES {{printf "%.2f" .Amount}}</td><td class="px-5 py-4 text-xs">{{.Receipt}}</td><td class="px-5 py-4"><span class="rounded-full bg-[#2f7a52] px-3 py-1 text-xs font-bold text-white">{{.Status}}</span></td></tr>{{else}}<tr><td colspan="6" class="px-5 py-12 text-center text-[#716e66]">No ledger entries found.</td></tr>{{end}}</tbody></table></div></div></main></body></html>
