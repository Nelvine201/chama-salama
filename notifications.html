<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-2xl px-4 py-8"><div class="mb-6 flex items-center justify-between"><h1 class="text-2xl font-bold text-[#1f5c3d]">Notifications</h1><a href="/dashboard" class="text-sm text-[#2f7a52]">Back to Dashboard</a></div>{{if .Notifications}}<div class="space-y-3">{{range .Notifications}}<article class="rounded-2xl bg-[#f4efe2] p-5"><h2 class="font-semibold text-[#1f5c3d]">{{.Title}}</h2><p class="mt-1 text-sm text-[#26241f]/75">{{.Message}}</p><p class="mt-2 text-xs text-[#26241f]/50">{{.CreatedAt}}</p></article>{{end}}</div>{{else}}<div class="rounded-2xl bg-[#f4efe2] p-8 text-center text-sm text-[#26241f]/60">No notifications yet.</div>{{end}}</main></body></html>
