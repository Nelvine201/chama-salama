<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Chama Salama</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-2xl px-4 py-7 sm:px-6"><div class="mb-7 flex items-center justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-widest text-[#2f7a52]">Alerts</p><h1 class="text-2xl font-bold text-[#1f5c3d]">Notifications</h1></div><a href="/dashboard" class="rounded-lg bg-[#1f5c3d] px-4 py-2 text-sm font-bold text-[#fbf8f1]">Dashboard</a></div>{{if .Notifications}}<div class="space-y-3">{{range .Notifications}}<article class="rounded-2xl border border-[#e4ded1] bg-[#f4efe2] p-5"><div class="flex items-start justify-between gap-3"><div><h2 class="font-semibold text-[#1f5c3d]">{{.Title}}</h2><p class="mt-1 text-sm text-[#26241f]/75">{{.Message}}</p><p class="mt-2 text-xs text-[#26241f]/50">{{.CreatedAt}}</p></div>{{if not .ReadAt.Valid}}<span class="rounded-full bg-[#c96f4a] px-2 py-1 text-[10px] font-bold text-white">New</span>{{end}}</div>{{if eq .Type "withdrawal_request"}}<div class="mt-4 flex gap-2"><form action="/withdraw/approve" method="POST"><input type="hidden" name="withdrawal_id" value="{{.ReferenceID.Int64}}"><button class="rounded-lg bg-[#1f5c3d] px-3 py-2 text-xs font-bold text-[#fbf8f1]">Approve</button></form><form action="/withdraw/reject" method="POST"><input type="hidden" name="withdrawal_id" value="{{.ReferenceID.Int64}}"><button class="rounded-lg border border-[#c96f4a] px-3 py-2 text-xs font-bold text-[#c96f4a]">Reject</button></form></div>{{end}}</article>{{end}}</div>{{else}}<div class="rounded-2xl border border-[#e4ded1] bg-[#f4efe2] p-8 text-center text-sm text-[#716e66]">No notifications yet.</div>{{end}}</main></body></html>
