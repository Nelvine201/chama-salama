<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotation Schedule — Chama Salama</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#fbf8f1] text-[#26241f]"><main class="mx-auto max-w-6xl px-4 py-7 sm:px-6"><div class="mb-7 flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs font-semibold uppercase tracking-widest text-[#2f7a52]">Active Chama</p><h1 class="text-2xl font-bold text-[#1f5c3d]">{{.ChamaName}}</h1><p class="mt-1 text-sm text-[#716e66]">Rotation schedule · {{.Frequency}}</p></div><a href="/dashboard?chama_id={{.ChamaID}}" class="rounded-lg bg-[#1f5c3d] px-4 py-2 text-sm font-bold text-[#fbf8f1]">Dashboard</a></div><div class="overflow-hidden rounded-2xl border border-[#e4ded1] bg-[#fffdf8]"><div class="overflow-x-auto"><table class="w-full min-w-[700px] text-left text-sm"><thead class="bg-[#f4efe2] text-xs uppercase tracking-wide text-[#716e66]"><tr><th class="px-5 py-4">Round</th><th class="px-5 py-4">Member</th><th class="px-5 py-4">Scheduled Payout</th><th class="px-5 py-4">Amount</th><th class="px-5 py-4">Status</th></tr></thead><tbody class="divide-y divide-[#e4ded1]">{{range .Rows}}<tr><td class="px-5 py-4 font-semibold text-[#1f5c3d]">Round {{.Round}}</td><td class="px-5 py-4"><div class="flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-full bg-[#1f5c3d] text-xs font-bold text-[#fbf8f1]">{{slice .Name 0 1}}</span>{{.Name}}</div></td><td class="px-5 py-4">{{.Date}}</td><td class="px-5 py-4 font-semibold">KES {{printf "%.2f" .Amount}}</td><td class="px-5 py-4"><span class="rounded-full px-3 py-1 text-xs font-bold {{if eq .Status "Completed"}}bg-[#2f7a52] text-white{{else if eq .Status "In Progress"}}bg-[#e6c258] text-[#26241f]{{else}}bg-[#f4efe2] text-[#1f5c3d]{{end}}">{{.Status}}</span></td></tr>{{else}}<tr><td colspan="5" class="px-5 py-12 text-center text-[#716e66]">No rotation rounds have been created yet.</td></tr>{{end}}</tbody></table></div></div></main></body></html>
